name: build-test-publish

# Lints and tests the code, builds the image and smoke tests it with Redis, then
# publishes a multi-arch image to GHCR. A push to master publishes `latest`;
# pushing a date tag (e.g. 2026-11-09) publishes that version.

on:
  push:
    branches: [master]
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      # puppeteer 2 cannot use its bundled Chromium on current Node, use the
      # Chrome preinstalled on the runner
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

  image:
    name: Build and smoke test image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: send:test
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Serves Send with Redis and the PabloSystems theme
        run: |
          docker network create send-test
          docker run -d --name send-redis --network send-test redis:alpine
          docker run -d --name send-test --network send-test -p 1443:1443 \
            -e REDIS_HOST=send-redis -e BASE_URL=http://localhost:1443 send:test
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:1443/__lbheartbeat__ && break
            sleep 1
          done

          # storage and Redis are reachable
          curl -sf -o /dev/null http://localhost:1443/__heartbeat__
          # the build stamps this fork as the source
          curl -sf http://localhost:1443/__version__ | grep -q '"source":"https://github.com/PabloVTM/send"'
          curl -sf -o "$RUNNER_TEMP/index.html" http://localhost:1443/
          grep -q 'pablo@systems' "$RUNNER_TEMP/index.html"
          grep -q 'content="#4B5A50"' "$RUNNER_TEMP/index.html"
          # Alpine has no pending security updates
          test "$(docker exec send-test apk list -u 2>/dev/null | wc -l)" -eq 0

      - name: Show container logs on failure
        if: failure()
        run: docker logs send-test || true

      - name: Remove test containers
        if: always()
        run: docker rm -f send-test send-redis || true

  publish:
    name: Publish multi-arch image to GHCR
    needs: [test, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/send
          tags: |
            # git tag 2026-11-09 -> image tag 2026-11-09
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true
